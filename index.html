<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f7">
<title>Shivani &amp; Abhishek — Wedding Invitation</title>
<meta name="description" content="Shivani and Abhishek's wedding invitation — 02 December 2026, Terapanth Sabha Bhawan, Sujangarh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&family=Marcellus&family=Noto+Serif+Devanagari:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="lang-hi">

<button id="musicPill" class="music-pill" type="button" aria-label="Toggle music">
  <span class="mp-note" id="musicNote">&#x1F507;</span><span class="mp-track">Mangal Rang</span>
</button>
<div id="yt-holder" aria-hidden="true"><div id="yt-music-frame"></div></div>

<div class="langbar" role="group" aria-label="Language">
  <button type="button" id="langHi" class="on">हिंदी</button>
  <button type="button" id="langEn">English</button>
</div>

<header class="hero" id="hero">
  <img class="hero-sky" src="./assets/hero-sky.webp" alt="">
  <div class="hero-cloud hc1"></div>
  <div class="hero-cloud hc2"></div>
  <div class="petals" aria-hidden="true"></div>
  <div class="hero-inner">
    <p class="hero-blessing" data-en="॥ Shri Ganeshay Namah ॥" data-hi="॥ श्री गणेशाय नमः ॥"></p>
    <h1 class="hero-names"><span class="nm" data-en="Shivani" data-hi="शिवानी"></span><span class="amp" data-en="&amp;" data-hi="और"></span><span class="nm" data-en="Abhishek" data-hi="अभिषेक"></span></h1>
    <p class="hero-sub" data-en="are getting married" data-hi="पवित्र बंधन में बंध रहे हैं"></p>
    <p class="hero-date" data-en="Wednesday • 02 December 2026" data-hi="बुधवार • 02 दिसंबर 2026"></p>
  </div>
  <div class="scroll-hint" aria-hidden="true"><span></span></div>
</header>

<section class="temple" id="temple">
  <img class="temple-art" src="./assets/temple-scene.webp" alt="Temple">
</section>

<section class="invitation" id="invitation">
  <img class="pillar pillar-l" src="./assets/pillar.webp" alt="">
  <img class="pillar pillar-r" src="./assets/pillar.webp" alt="">
  <div class="invite-inner">
    <p class="inv-deities" data-en="ॐ Shri Mataji Maharaj ॐ Jai Shri Salasar Balaji ॐ Shri Pitarji Maharaj ॐ" data-hi="ॐ श्री माताजी महाराज ॐ जय श्री सालासर बालाजी ॐ श्री पितर जी महाराज ॐ"></p>
    <p class="inv-shloka" data-en="Vakratunda Mahakaya, Suryakoti Samaprabha |<br>Nirvighnam Kurume Deva, Sarvakaryeshu Sarvada ||" data-hi="वक्रतुण्ड महाकाय, सूर्यकोटि समप्रभ: ।<br>निर्विघ्नं कुरुमे देव, सर्वकार्येषु सर्वदा: ॥"></p>
    <h2 class="inv-names" data-en="Shivani &amp; Abhishek" data-hi="शिवानी और अभिषेक"></h2>
    <p class="inv-line" data-en="With the boundless grace of the Almighty, you are warmly invited" data-hi="स्नेही स्वजन, परमपिता परमेश्वर की असीम अनुकम्पा से आप सादर आमंत्रित हैं"></p>
    <h3 class="inv-events-head" data-en="Wedding Celebrations" data-hi="हमारे विवाह के कार्यक्रम"></h3>
  </div>
</section>

<section class="events" id="events"></section>

<section class="reveal" id="reveal">
  <div class="reveal-sticky">
    <img class="reveal-art" src="./assets/wedding-reveal.webp" alt="Wedding temple">
    <figure class="reveal-card card tilt-r" id="revealCard">
      <div class="card-stack" aria-hidden="true"></div>
      <div class="art"><img src="./assets/ev-wedding.webp" alt="Wedding"></div>
      <figcaption class="card-text">
        <strong class="card-title c-wedding" data-en="Wedding" data-hi="पाणिग्रहण संस्कार"></strong>
        <span class="card-when" data-en="Wednesday, 02 December 2026 • Shubh Muhurat (Night)" data-hi="बुधवार, 02 दिसंबर 2026 • रात्रि शुभ लग्न में"></span>
        <span class="card-venue" data-en="Terapanth Sabha Bhawan, Sujangarh" data-hi="तेरापंथ सभा भवन, सूजानगढ़"></span>
      </figcaption>
    </figure>
  </div>
</section>

<section class="courtyard" id="courtyard">
  <img class="courtyard-art" src="./assets/courtyard.webp" alt="Wedding courtyard">
</section>

<section class="story" id="story">
  <img class="story-floral sf-l" src="./assets/floral.webp" alt="">
  <img class="story-floral sf-r" src="./assets/floral.webp" alt="">
  <img class="story-bow" src="./assets/bow.webp" alt="">
  <img class="story-lantern" src="./assets/lantern.webp" alt="">
  <div class="story-head">
    <p class="story-eyebrow" data-en="Meet The" data-hi="मिलिए"></p>
    <p class="story-sub" data-en="Bride &amp; Groom" data-hi="वर एवं वधू से"></p>
    <h2 class="story-title" data-en="Our Story" data-hi="हमारी कहानी"></h2>
  </div>
  <div class="arch-panel">
    <svg class="arch-top" viewBox="0 0 400 240" preserveAspectRatio="none" aria-hidden="true"><path class="arch-gold" fill="#c9a227"></path><path class="arch-white" fill="#fdfaf3"></path></svg>
    <div class="arch-body">
      <div class="gold-frame"><img src="./assets/story-couple.webp" alt="Shivani and Abhishek"></div>
    </div>
  </div>
  <div class="story-cols" id="storyCols"></div>
</section>

<section class="venue" id="venue">
  <h2 class="sec-title" data-en="Venue" data-hi="वैवाहिक स्थल"></h2>
  <p class="venue-name" data-en="Terapanth Sabha Bhawan" data-hi="तेरापंथ सभा भवन"></p>
  <p class="venue-addr" data-en="Shastri Pyau, Sujangarh (Churu), Rajasthan" data-hi="शास्त्री प्याऊ, सूजानगढ़ (चूरु), राजस्थान"></p>
  <a class="venue-map" href="https://www.google.com/maps/search/?api=1&amp;query=Terapanth+Sabha+Bhawan+Sujangarh" target="_blank" rel="noopener" data-en="Open in Google Maps" data-hi="गूगल मैप्स में देखें"></a>
  <h2 class="sec-title count-title" data-en="Counting the Days" data-hi="शुभ घड़ी की प्रतीक्षा"></h2>
  <div class="count" role="timer">
    <div class="count-cell"><strong id="cdD">00</strong><span data-en="Days" data-hi="दिन"></span></div>
    <div class="count-cell"><strong id="cdH">00</strong><span data-en="Hours" data-hi="घंटे"></span></div>
    <div class="count-cell"><strong id="cdM">00</strong><span data-en="Mins" data-hi="मिनट"></span></div>
    <div class="count-cell"><strong id="cdS">00</strong><span data-en="Secs" data-hi="सेकंड"></span></div>
  </div>
  <p class="footer-note" data-en="Hosted by: Ajay S/o Late Shri Pawan Kumar Ji Songara • Mo. 7023414828, 9461160706" data-hi="प्रेषक: अजय, सु. स्व. पवन कुमार जी सोनगरा • मो. 7023414828, 9461160706"></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
